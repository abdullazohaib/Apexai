<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} · AI Comparator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --chatgpt: #10a37f;
    --gemini: #4285f4;
    --claude: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  header {
    padding: 32px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-left {}
  .logo { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 4px; color: var(--accent); margin-bottom: 6px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  nav a {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 20px;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--accent); }

  .refresh-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 8px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  main { padding-top: 36px; padding-bottom: 60px; }

  /* Stat cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: rgba(108,99,255,0.3); }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card:nth-child(1)::before { background: var(--accent); }
  .stat-card:nth-child(2)::before { background: var(--accent3); }
  .stat-card:nth-child(3)::before { background: var(--accent2); }
  .stat-card:nth-child(4)::before { background: var(--claude); }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .stat-value { font-size: 36px; font-weight: 600; letter-spacing: -1px; }

  /* Two-col grid */
  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 700px) { .dash-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .card-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Winner distribution bars */
  .winner-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .winner-model { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; width: 72px; }
  .win-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 8px; overflow: hidden; }
  .win-bar-fill { height: 100%; border-radius: 8px; transition: width 1s cubic-bezier(0.16,1,0.3,1); }
  .win-count { font-size: 13px; font-weight: 600; width: 30px; text-align: right; }

  /* Avg scores */
  .avg-row { margin-bottom: 16px; }
  .avg-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .avg-track { height: 6px; background: var(--border); border-radius: 6px; overflow: hidden; }
  .avg-fill { height: 100%; border-radius: 6px; transition: width 1s cubic-bezier(0.16,1,0.3,1); }

  /* Cache stats */
  .cache-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cache-item {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .cache-item-val { font-size: 24px; font-weight: 600; }
  .cache-item-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 12px;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(108,99,255,0.04); }

  .q-cell {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .pill-chatgpt { background: rgba(16,163,127,0.15); color: var(--chatgpt); }
  .pill-gemini { background: rgba(66,133,244,0.15); color: var(--gemini); }
  .pill-claude { background: rgba(217,119,6,0.15); color: var(--claude); }
  .pill-cache { background: rgba(67,233,123,0.1); color: var(--accent3); }

  .loading { color: var(--muted); font-style: italic; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <div class="logo">▸ AI Toolkit</div>
      <h1>Admin Dashboard</h1>
    </div>
    <nav>
      <a href="/">Comparator</a>
      <a href="/docs" target="_blank">API</a>
      <button class="refresh-btn" onclick="loadDashboard()">↺ Refresh</button>
    </nav>
  </header>

  <main>
    <div id="dash-content"><p class="loading">Loading analytics…</p></div>
  </main>
</div>

<script>
async function loadDashboard() {
  try {
    const res = await fetch('/api/v1/dashboard/stats');
    const d = await res.json();
    render(d);
  } catch(e) {
    document.getElementById('dash-content').innerHTML = `<p style="color:#f87171;padding:40px;text-align:center">Failed to load: ${e.message}</p>`;
  }
}

function render(d) {
  const winTotal = Object.values(d.winner_distribution).reduce((a,b)=>a+b,0) || 1;
  const colors = { chatgpt:'#10a37f', gemini:'#4285f4', claude:'#d97706' };
  const cacheRate = d.total_queries > 0 ? ((d.cache_hits/d.total_queries)*100).toFixed(1) : 0;

  // winner bars
  const winBars = ['chatgpt','gemini','claude'].map(m => {
    const cnt = d.winner_distribution[m] || 0;
    const pct = (cnt/winTotal*100).toFixed(1);
    return `<div class="winner-row">
      <span class="winner-model" style="color:${colors[m]}">${m}</span>
      <div class="win-bar-track"><div class="win-bar-fill" style="width:${pct}%;background:${colors[m]}"></div></div>
      <span class="win-count">${cnt}</span>
    </div>`;
  }).join('');

  // avg score bars
  const avgBars = ['chatgpt','gemini','claude'].map(m => {
    const v = (d.avg_scores[m]*100).toFixed(1);
    return `<div class="avg-row">
      <div class="avg-label"><span style="color:${colors[m]};font-weight:600">${m.toUpperCase()}</span><span>${v}%</span></div>
      <div class="avg-track"><div class="avg-fill" style="width:${v}%;background:${colors[m]}"></div></div>
    </div>`;
  }).join('');

  // recent table
  const rows = (d.recent_queries || []).map(q => {
    const date = q.created_at ? new Date(q.created_at).toLocaleString() : '-';
    const cacheTag = q.from_cache ? `<span class="pill pill-cache">⚡</span>` : '';
    const winPill = q.winner ? `<span class="pill pill-${q.winner}">${q.winner}</span>` : '-';
    const scores = [q.score_chatgpt, q.score_gemini, q.score_claude]
      .map(s => s != null ? (s*100).toFixed(0)+'%' : '-').join(' / ');
    return `<tr>
      <td style="color:var(--muted);font-size:11px">#${q.id}</td>
      <td class="q-cell">${escapeHtml(q.question)}</td>
      <td>${winPill} ${cacheTag}</td>
      <td style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)">${scores}</td>
      <td style="font-size:11px;color:var(--muted)">${date}</td>
    </tr>`;
  }).join('');

  document.getElementById('dash-content').innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Queries</div>
        <div class="stat-value">${d.total_queries}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cache Hits</div>
        <div class="stat-value">${d.cache_hits}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cache Rate</div>
        <div class="stat-value">${cacheRate}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Keys</div>
        <div class="stat-value">${d.cache_stats.active_keys}</div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <div class="card-title">Winner Distribution</div>
        ${winBars}
      </div>
      <div class="card">
        <div class="card-title">Average Scores</div>
        ${avgBars}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Cache Stats</div>
      <div class="cache-grid">
        <div class="cache-item">
          <div class="cache-item-val" style="color:var(--accent)">${d.cache_stats.total_keys}</div>
          <div class="cache-item-lbl">Total Keys</div>
        </div>
        <div class="cache-item">
          <div class="cache-item-val" style="color:var(--accent3)">${d.cache_stats.active_keys}</div>
          <div class="cache-item-lbl">Active</div>
        </div>
        <div class="cache-item">
          <div class="cache-item-val" style="color:var(--accent2)">${d.cache_stats.expired_keys}</div>
          <div class="cache-item-lbl">Expired</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-title">Recent Queries</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Question</th><th>Winner</th><th>Scores (GPT/Gem/Cld)</th><th>Time</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px">No queries yet</td></tr>'}</tbody>
        </table>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadDashboard();
setInterval(loadDashboard, 30000); // auto-refresh every 30s
</script>
</body>
</html>
